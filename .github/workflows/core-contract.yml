name: Core contract
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - run: python -m pip install --only-binary=:all: --require-hashes -r requirements/dev.lock
      - run: python -m mypy
      - run: python -m pip_audit --disable-pip --require-hashes -r requirements/a5-transport.lock -r requirements/build.lock -r requirements/dev.lock
      - name: Compare the live API against draft.33
        run: |
          archive=oasdiff_1.36.0_linux_amd64.tar.gz
          curl --fail --silent --show-error --location --max-time 90 \
            "https://github.com/oasdiff/oasdiff/releases/download/v1.36.0/$archive" -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' dba65661f6d0f178a3e4884c309f19527a849388bb9df0e81545db76dbb697d6 \
            "$RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oasdiff
          PYTHONPATH=src python scripts/export-core-openapi.py "$RUNNER_TEMP/openapi.json"
          "$RUNNER_TEMP/oasdiff" breaking --flatten-allof --fail-on ERR \
            tests/fixtures/api_v2/openapi-draft33.json "$RUNNER_TEMP/openapi.json"
      - name: Run Core behavior tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_api_v2*.py'
          python -m unittest tests.test_downloads tests.test_domain_sources tests.test_install_preparation \
            tests.test_installer_pip_environment tests.test_split_runtime_imports tests.test_s2a_core_boundary
      - name: Build and verify the installed wheel
        run: |
          python -m build --no-isolation
          python -m venv "$RUNNER_TEMP/core"
          "$RUNNER_TEMP/core/bin/python" -I -m pip install --only-binary=:all: --require-hashes -r requirements/a5-transport.lock
          "$RUNNER_TEMP/core/bin/python" -I -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/core/bin/python" -I -m pip check
          repo="$PWD"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/core/bin/python" -I "$repo/scripts/export-core-openapi.py" "$RUNNER_TEMP/installed.json"
          cmp "$RUNNER_TEMP/openapi.json" "$RUNNER_TEMP/installed.json"
