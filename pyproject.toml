[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-access-control-plane"
version = "0.4.5"
license = {file = "LICENSE"}
description = "Headless Core API and control plane for zapret2 strategy discovery."
requires-python = ">=3.11"
dependencies = [
    "bottle==0.13.4",
    "cheroot==11.1.2",
]

[project.scripts]
gp-control-plane = "gp_control_plane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
"gp_control_plane.http" = ["openapi.json"]
